<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Vitni, your repair sidekick</title>
  <desc id="desc">A friendly comic helper robot with bright, expressive eyes and a small wrench.</desc>
  <g stroke="#142F2A" stroke-linecap="round" stroke-linejoin="round">
